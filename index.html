<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#07090e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="GymTracker Pro: rutinas, series, marcas y descansos. 100% local, sin cuentas ni límites. Un solo archivo HTML.">
<title>GymTracker Pro — Entrena y progresa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d6ff3f'/%3E%3Cpath d='M9 11v10M6 13v6M23 11v10M26 13v6M9 16h14' stroke='%230a0e14' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07090e;
  --bg2:#0b0f17;
  --surf:#111823;
  --surf2:#182130;
  --surf3:#1f2a3b;
  --line:#273244;
  --line2:#33415a;
  --txt:#f2f6ff;
  --mut:#96a5bd;
  --dim:#7d8ba1;
  --acc:#d6ff3f;
  --acc-d:#b6e018;
  --ink:#0a0e14;
  --danger:#ff5d73;
  --radius:20px;
  --nav-h:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 420px at 50% -160px, rgba(214,255,63,.09), transparent 70%),
    radial-gradient(600px 380px at 100% 10%, rgba(56,189,248,.05), transparent 70%),
    var(--bg);
  color:var(--txt);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;
  min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
body.resting{padding-bottom:calc(var(--nav-h) + 148px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
::selection{background:var(--acc);color:var(--ink)}
h1,h2,h3,h4,p{margin:0}
.hide{display:none !important}

.wrap{max-width:620px;margin:0 auto;padding:0 16px}
header.top{
  position:sticky;top:0;z-index:30;
  backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(7,9,14,.96),rgba(7,9,14,.82));
  border-bottom:1px solid rgba(39,50,68,.7);
}
.top-in{display:flex;align-items:center;gap:10px;height:60px;max-width:620px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.3px;line-height:1}
.brand span{display:block;font-size:9.5px;letter-spacing:2.4px;color:var(--acc);font-weight:800;margin-top:3px}
.top-sp{flex:1}
.icon-btn{width:44px;height:44px;border-radius:13px;background:var(--surf2);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn svg{width:21px;height:21px;stroke:#cfdaea;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:var(--surf3)}
.timer-pill{
  display:flex;align-items:center;gap:7px;height:44px;padding:0 13px;border-radius:13px;
  background:rgba(214,255,63,.12);border:1px solid rgba(214,255,63,.4);color:var(--acc);
  font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;
}
.timer-pill svg{width:17px;height:17px;stroke:var(--acc);fill:none;stroke-width:2}

main{padding-top:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.kicker{font-size:10.5px;letter-spacing:2.2px;font-weight:800;color:var(--acc);text-transform:uppercase}
h1.title{font-size:29px;line-height:1.05;letter-spacing:-1.1px;font-weight:900;margin-top:5px}
h2.sect{font-size:15px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;color:#cbd6e6;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2.sect .n{color:var(--dim);font-weight:700}
p.sub{color:var(--mut);font-size:13.5px;line-height:1.5}

.card{background:linear-gradient(180deg,#131b27 0%,#0e131c 100%);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.card + .card{margin-top:10px}

/* ---------- botones ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;padding:0 18px;border-radius:16px;font-weight:800;font-size:15.5px;
  letter-spacing:.1px;transition:transform .08s ease,background .15s ease;border:1px solid transparent;
}
.btn:active{transform:scale(.975)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--acc);color:var(--ink);box-shadow:0 6px 22px rgba(214,255,63,.16)}
.btn-primary:active{background:var(--acc-d)}
.btn-ghost{background:var(--surf2);border-color:var(--line2);color:var(--txt)}
.btn-ghost:active{background:var(--surf3)}
.btn-danger{background:rgba(255,93,115,.11);border-color:rgba(255,93,115,.45);color:#ff8b9c}
.btn-sm{min-height:44px;padding:0 13px;font-size:13.5px;border-radius:13px}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px}
.btn-row > *{flex:1}
.link{color:var(--acc);font-weight:800;font-size:13px}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 10px;border-radius:9px;
  font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
  background:var(--surf3);color:#c9d5e6;border:1px solid var(--line2);white-space:nowrap;
}
.chip.eq{background:transparent;border-color:var(--line);color:var(--mut)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- home ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:24px;padding:20px;
  background:
    linear-gradient(135deg,rgba(214,255,63,.14) 0%,rgba(214,255,63,0) 46%),
    linear-gradient(180deg,#16202e,#0d1219);
  border:1px solid #2c3a4e;
}
.hero:after{
  content:"";position:absolute;right:-40px;top:-30px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle,rgba(214,255,63,.12),transparent 65%);
}
.hero h2{font-size:22px;font-weight:900;letter-spacing:-.6px;line-height:1.15}
.hero p{color:var(--mut);font-size:13.5px;margin-top:4px;max-width:280px}
.hero .btn{margin-top:16px}
.score{display:flex;gap:10px;margin-top:16px}
.stat{
  flex:1;background:rgba(9,12,18,.55);border:1px solid var(--line);border-radius:15px;padding:10px 11px;
}
.stat b{display:block;font-size:20px;font-weight:900;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);font-weight:800;margin-top:2px}

.routine-card{display:flex;align-items:center;gap:12px;padding:12px 13px}
.routine-avatar{
  width:52px;height:52px;border-radius:15px;flex:none;display:grid;place-items:center;
  background:linear-gradient(160deg,#243044,#151d29);border:1px solid var(--line2);
  font-size:19px;font-weight:900;color:var(--acc);letter-spacing:-1px;
}
.routine-info{flex:1;min-width:0}
.routine-info b{display:-webkit-box;font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.25;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.routine-info span{display:block;color:var(--mut);font-size:12px;line-height:1.35;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.start-btn{
  width:48px;height:48px;border-radius:14px;background:var(--acc);color:var(--ink);
  display:grid;place-items:center;flex:none;
}
.start-btn svg{width:22px;height:22px;fill:var(--ink)}
.mini-links{display:flex;gap:6px;margin-top:10px}
.tiny-btn{
  height:36px;padding:0 10px;border-radius:10px;background:transparent;border:1px solid var(--line);
  color:var(--mut);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;
}
.tiny-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- catálogo ---------- */
.searchbox{position:relative;margin-bottom:12px}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:var(--dim);fill:none;stroke-width:2}
.searchbox input{
  width:100%;height:52px;border-radius:15px;border:1px solid var(--line);background:var(--surf);
  color:var(--txt);padding:0 14px 0 42px;font-size:15px;outline:none;
}
.searchbox input:focus{border-color:var(--line2);background:var(--surf2)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{
  flex:none;height:38px;padding:0 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--surf);color:var(--mut);font-size:12.5px;font-weight:800;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;
}
.fchip.on{background:var(--txt);color:var(--ink);border-color:var(--txt)}
.fchip.on .dot{background:var(--ink)}
.fchip .cnt{opacity:.5;font-size:11px}
.filters.equip .fchip{height:36px;font-size:12px;background:transparent}

.ex-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:9px 10px 9px 8px;border-radius:16px;border:1px solid transparent;
}
.ex-row:active{background:var(--surf2);border-color:var(--line)}
.ex-thumb{
  width:78px;height:66px;flex:none;border-radius:13px;background:
    radial-gradient(70% 70% at 50% 35%,rgba(214,255,63,.07),transparent 70%),#0c111a;
  border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;
}
.ex-thumb svg{width:100%;height:100%;display:block}
.ex-main{flex:1;min-width:0}
.ex-main b{display:block;font-size:14.5px;font-weight:800;line-height:1.25;letter-spacing:-.15px}
.ex-meta{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
.ex-meta .chip{height:21px;font-size:9.5px;padding:0 7px;letter-spacing:.5px}
.ex-go{width:26px;flex:none;color:var(--dim)}
.ex-go svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.empty{text-align:center;padding:36px 16px;color:var(--dim);font-size:13.5px}
.empty svg{width:46px;height:46px;stroke:var(--line2);fill:none;stroke-width:1.6;margin-bottom:10px}

/* ---------- sesión ---------- */
.session-top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;
  padding:13px 14px;border-radius:18px;background:linear-gradient(135deg,#182231,#0e141d);border:1px solid var(--line);
}
.session-top .t{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);font-weight:800}
.session-top b{display:block;font-size:18px;font-weight:900;letter-spacing:-.4px;margin-top:2px}
.session-top .clock{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.session-top .clock small{display:block;font-size:9px;letter-spacing:1.4px;color:var(--dim);text-align:right;font-weight:800}

.ex-card{margin-bottom:11px;padding:13px;border-radius:20px;background:linear-gradient(180deg,#121a26,#0d121a);border:1px solid var(--line)}
.ex-card.done{border-color:rgba(214,255,63,.32);background:linear-gradient(180deg,rgba(214,255,63,.07),#0d121a 60%)}
.ex-card-head{display:flex;gap:10px;align-items:flex-start}
.ex-card-head .idx{width:24px;height:24px;border-radius:7px;background:var(--surf3);color:var(--mut);font-size:11px;font-weight:900;display:grid;place-items:center;flex:none;margin-top:2px}
.ex-card-head .nm{flex:1;min-width:0}
.ex-card-head .nm b{font-size:15.5px;font-weight:800;letter-spacing:-.2px;line-height:1.25;display:block}
.lastmark{font-size:11.5px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.lastmark b{color:#dbe6f6;font-weight:800;font-variant-numeric:tabular-nums}
.lastmark svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.ex-tools{display:flex;gap:6px}
.tool{width:40px;height:40px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.tool svg{width:18px;height:18px;stroke:#c3d0e2;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool:active{background:var(--surf3)}

.set-head{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;margin:14px 0 6px;padding:0 2px}
.set-head span{font-size:9.5px;letter-spacing:1.2px;color:var(--dim);font-weight:800;text-transform:uppercase;text-align:center}
.set-head span:first-child{text-align:left}
.set-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center;margin-bottom:7px}
.set-n{font-size:13px;font-weight:900;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.set-row.done .set-n{color:var(--acc)}
.inp-wrap{position:relative;min-width:0}
.inp-wrap input{
  width:100%;min-width:0;height:52px;border-radius:13px;background:#0a0f16;border:1px solid var(--line2);
  color:var(--txt);font-size:18px;font-weight:800;text-align:center;outline:none;
  font-variant-numeric:tabular-nums;padding:0 24px 0 6px;
}
.inp-wrap input::-webkit-outer-spin-button,.inp-wrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp-wrap input{appearance:textfield;-moz-appearance:textfield}
.inp-wrap input:focus{border-color:var(--acc);background:#0d1319}
.inp-wrap .u{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:9.5px;color:var(--dim);font-weight:800;pointer-events:none;letter-spacing:.5px}
.set-row.done .inp-wrap input{border-color:rgba(214,255,63,.55);background:rgba(214,255,63,.05)}
.check{
  width:50px;height:52px;border-radius:13px;background:var(--surf2);border:1px solid var(--line2);
  display:grid;place-items:center;transition:all .12s;
}
.check svg{width:21px;height:21px;stroke:var(--mut);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.check.on{background:var(--acc);border-color:var(--acc)}
.check.on svg{stroke:var(--ink)}
.set-del{grid-column:2 / -1;font-size:11px;color:var(--dim);text-align:right;padding:0 4px 4px;margin-top:-5px}
.set-del span{text-decoration:underline;text-underline-offset:2px}
.card-foot{display:grid;grid-template-columns:1fr 1.05fr 1.15fr;gap:7px;margin-top:9px}
.card-foot .btn{min-width:0;padding:0 6px;min-height:45px;font-size:12.5px;border-radius:12px;background:var(--surf2);border:1px solid var(--line2);color:#cfdaea;font-weight:800;gap:4px;overflow:hidden;white-space:nowrap}
.card-foot .btn svg{width:16px;height:16px;flex:none}
.card-foot .btn:active{background:var(--surf3)}
.note{margin-top:9px}
.note textarea{
  width:100%;min-height:46px;border-radius:12px;background:#0a0f16;border:1px solid var(--line);
  color:var(--txt);padding:10px 12px;font-size:13.5px;resize:vertical;outline:none;line-height:1.4;
}
.note textarea:focus{border-color:var(--line2)}
.add-ex{margin-top:4px;border:1px dashed var(--line2);background:rgba(24,33,48,.4);color:#cfdaea;min-height:52px;border-radius:15px;width:100%;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}

/* ---------- historial ---------- */
.hist-item{display:flex;align-items:center;gap:12px;padding:13px 14px}
.hist-date{width:48px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.hist-date b{display:block;font-size:19px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.hist-date span{display:block;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:800;margin-top:3px}
.hist-main{flex:1;min-width:0}
.hist-main b{display:block;font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-main span{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.hist-vol{font-size:13px;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums;flex:none}
.sel{
  width:100%;height:50px;border-radius:13px;background:var(--surf);border:1px solid var(--line2);
  color:var(--txt);padding:0 12px;font-size:14px;font-weight:700;outline:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2396a5bd' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:18px;
}
.pr-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pr{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px 11px;min-width:92px}
.pr span{display:block;font-size:9px;letter-spacing:1.2px;color:var(--dim);font-weight:800;text-transform:uppercase}
.pr b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.hrow{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;padding:9px 4px;border-bottom:1px solid rgba(39,50,68,.6);font-size:12.5px}
.hrow:last-child{border-bottom:0}
.hrow .d{color:var(--mut);font-variant-numeric:tabular-nums}
.hrow .s{font-weight:800;font-variant-numeric:tabular-nums}
.hrow .v{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}

/* ---------- ajustes ---------- */
.set-rowline{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid rgba(39,50,68,.65)}
.set-rowline:last-child{border-bottom:0}
.set-rowline b{font-size:14.5px;font-weight:800;display:block}
.set-rowline span{font-size:11.5px;color:var(--mut);display:block;margin-top:1px}
.seg{display:flex;gap:6px;flex:1 1 auto;min-width:0;justify-content:flex-end}
.seg button{
  flex:1 1 0;min-width:0;height:42px;padding:0 6px;border-radius:11px;background:var(--surf2);border:1px solid var(--line2);
  color:var(--mut);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;
}
.seg button.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}


/* ---------- zonas ---------- */
.chip.zone{background:rgba(214,255,63,.09);border-color:rgba(214,255,63,.28);color:#d6ff3f}
.filters.zones{padding-bottom:8px}
.filters.zones .fchip{height:38px;font-size:11.5px;background:transparent;border-style:dashed}
.filters.zones .fchip.on{background:var(--acc);color:var(--ink);border-style:solid;border-color:var(--acc)}
.copy-last{
  display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:7px;
  border:1px solid rgba(214,255,63,.32);background:rgba(214,255,63,.08);color:var(--acc);
  font-size:10px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;
}
.copy-last svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2}
.copy-last:active{background:rgba(214,255,63,.18)}

/* ---------- gráfica de progreso ---------- */
.chart-card{padding:12px 12px 10px}
.chartseg{display:flex;gap:5px;margin-bottom:8px}
.chartseg button{
  flex:1;height:38px;border-radius:9px;background:transparent;border:1px solid var(--line2);
  color:var(--mut);font-size:10.5px;font-weight:900;letter-spacing:.3px;text-transform:uppercase;
}
.chartseg button.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 10px;color:var(--dim);font-size:12px;text-align:center}
.chart-empty svg{width:30px;height:30px;stroke:var(--line2);fill:none;stroke-width:1.7}
.chart-foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:11px;color:var(--mut)}
.chart-foot span{font-weight:900;color:#dbe6f6}
.chart-foot span.up{color:var(--acc)}
.chart-foot span.down{color:#ff7a90}
.chart-foot .best{margin-left:auto;color:var(--dim);font-weight:700}


/* ---------- aviso de récord ---------- */
.pr-banner{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 68px);
  transform:translate(-50%,-150%);opacity:0;pointer-events:none;
  z-index:210;width:calc(100% - 24px);max-width:430px;
  display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:16px;
  background:linear-gradient(135deg,#202c13,#0f1708);border:1px solid rgba(214,255,63,.55);
  box-shadow:0 16px 44px rgba(0,0,0,.7),0 0 0 4px rgba(214,255,63,.07);
  transition:transform .3s cubic-bezier(.2,.9,.2,1),opacity .3s;
}
.pr-banner.on{transform:translate(-50%,0);opacity:1}
.pr-ico{width:38px;height:38px;border-radius:11px;background:var(--acc);display:grid;place-items:center;flex:none}
.pr-ico svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linejoin:round}
.pr-txt{flex:1;min-width:0}
.pr-txt b{display:block;font-size:13.5px;font-weight:900;color:var(--acc);letter-spacing:.2px}
.pr-txt span{display:block;font-size:11.5px;color:#c9d5e6;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-val{font-size:16px;font-weight:900;color:#f2f6ff;font-variant-numeric:tabular-nums;flex:none}

/* ---------- ajustes: interruptor ---------- */
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.opt-row b{font-size:14.5px;display:block}
.opt-sub{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.switch{position:relative;width:56px;height:44px;background:transparent;border:0;flex:none;padding:0}
.switch::before{content:'';position:absolute;left:1px;top:6px;width:54px;height:32px;border-radius:16px;background:var(--surf3);border:1px solid var(--line2);transition:background .18s,border-color .18s}
.switch.on::before{background:var(--acc);border-color:var(--acc)}
.switch i{position:absolute;top:9px;left:4px;width:24px;height:24px;border-radius:50%;background:#8b98ad;transition:transform .18s,background .18s}
.switch.on i{transform:translateX(22px);background:var(--ink)}

/* ---------- nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(9,12,18,.94);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);position:relative}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:9.5px;font-weight:800;letter-spacing:.4px}
.tab.on{color:var(--acc)}
.tab.on:before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.tab .badge{position:absolute;top:9px;right:calc(50% - 20px);width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(214,255,63,.15)}

/* ---------- rest bar ---------- */
.restbar{
  position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:38;
  padding:0 10px 10px;transform:translateY(160%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
}
.restbar.on{transform:translateY(0)}
.rest-in{
  max-width:600px;margin:0 auto;background:linear-gradient(180deg,#1b2536,#11161f);
  border:1px solid rgba(214,255,63,.45);border-radius:18px;padding:10px 12px;
  box-shadow:0 -12px 40px rgba(0,0,0,.6);
}
.rest-top{display:flex;align-items:center;gap:10px}
.rest-time{font-size:27px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;color:var(--acc);min-width:78px}
.rest-lbl{flex:1;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-weight:800;line-height:1.3}
.rest-lbl b{display:block;color:var(--txt);font-size:11.5px;letter-spacing:.3px;text-transform:none;margin-top:2px}
.wake-mini{width:38px;height:38px;border-radius:10px;background:var(--surf2);border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.wake-mini svg{width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:1.9;stroke-linecap:round}
.wake-mini.on{border-color:rgba(214,255,63,.45);background:rgba(214,255,63,.12)}
.wake-mini.on svg{stroke:var(--acc)}
.rest-quick{display:flex;gap:6px;margin-top:9px}
.rest-quick button{
  flex:1;height:38px;border-radius:10px;background:var(--surf2);border:1px solid var(--line2);
  font-size:12.5px;font-weight:800;color:#cfdaea;font-variant-numeric:tabular-nums;
}
.rest-quick button.on{background:rgba(214,255,63,.16);border-color:var(--acc);color:var(--acc)}
.rest-quick button.skip{flex:.7;color:var(--mut)}
.rest-track{height:3px;background:#0a0e14;border-radius:2px;margin-top:9px;overflow:hidden}
.rest-track i{display:block;height:100%;background:var(--acc);width:100%;transition:width .25s linear}

/* ---------- sheet / modal ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(3,5,8,.75);backdrop-filter:blur(4px);opacity:0;transition:opacity .2s}
.sheet-wrap.on .sheet-bg{opacity:1}
.sheet{
  position:relative;width:100%;max-width:620px;max-height:93dvh;background:#0d121b;
  border-radius:26px 26px 0 0;border:1px solid var(--line2);border-bottom:0;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet-wrap.on .sheet{transform:translateY(0)}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:18px;font-weight:900;letter-spacing:-.4px;line-height:1.2;flex:1}
.sheet-head .sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.sheet-x{width:40px;height:40px;border-radius:12px;background:var(--surf2);display:grid;place-items:center;flex:none}
.sheet-x svg{width:18px;height:18px;stroke:var(--txt);fill:none;stroke-width:2.2;stroke-linecap:round}
.sheet-body{overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}

/* exercise detail */
.detail-svg{
  position:relative;background:radial-gradient(60% 70% at 50% 40%,rgba(214,255,63,.08),transparent 70%),#080c12;
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
}
.detail-svg svg{width:100%;height:236px;display:block}
.detail-svg .phase{position:absolute;left:10px;bottom:10px;display:flex;gap:4px;background:rgba(8,12,18,.8);border:1px solid var(--line);border-radius:10px;padding:3px}
.detail-svg .phase button{height:28px;padding:0 9px;border-radius:7px;font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.4px;text-transform:uppercase}
.detail-svg .phase button.on{background:var(--acc);color:var(--ink)}
.detail-svg .play{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:11px;background:rgba(8,12,18,.85);border:1px solid var(--line2);display:grid;place-items:center}
.detail-svg .play svg{width:16px;height:16px;stroke:var(--acc);fill:none;stroke-width:2.2}
.muscle-tag{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 9px;border-radius:8px;background:rgba(8,12,18,.8);border:1px solid var(--line);font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.d-meta{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.d-tip{font-size:13px;color:#c2cfe1;background:rgba(24,33,48,.55);border-left:2px solid var(--acc);padding:9px 11px;border-radius:0 10px 10px 0;margin-top:12px}
.d-last{display:flex;gap:8px;margin-top:12px}
.d-last .cell{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:9px 11px}
.d-last .cell span{display:block;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:800}
.d-last .cell b{display:block;font-size:15px;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}
.d-last .cell small{color:var(--mut);font-weight:600;font-size:11px}

/* alternatives */
.alt-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px;border-radius:14px;border:1px solid transparent}
.alt-item:active{background:var(--surf2);border-color:var(--line)}
.alt-item .ex-thumb{width:66px;height:58px;border-radius:11px}
.alt-item .m{flex:1;min-width:0}
.alt-item .m b{font-size:13.5px;font-weight:800;display:block;line-height:1.25}
.alt-item .m span{font-size:10.5px;color:var(--mut)}
.alt-item .use{height:38px;padding:0 12px;border-radius:10px;background:var(--acc);color:var(--ink);font-weight:900;font-size:12px;flex:none}
.dialog-btns{display:flex;gap:9px;margin-top:6px}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px);transform:translate(-50%,20px);
  background:#e9f0fb;color:#0a0e14;padding:11px 16px;border-radius:13px;font-size:13px;font-weight:800;
  z-index:200;opacity:0;pointer-events:none;transition:all .2s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.notice{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;height:50px;border-radius:12px;background:#0a0f16;border:1px solid var(--line2);
  color:var(--txt);padding:0 12px;font-size:15px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
.pick-list{max-height:46dvh;overflow-y:auto;border:1px solid var(--line);border-radius:14px}
.pick{display:flex;align-items:center;gap:2px;border-bottom:1px solid rgba(39,50,68,.6);width:100%;text-align:left;padding-right:6px}
.pick-toggle{display:flex;align-items:center;gap:10px;padding:9px 11px;flex:1;min-width:0;text-align:left}
.swapbtn{width:40px;height:40px;border-radius:11px;background:var(--surf2);border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.swapbtn svg{width:17px;height:17px;stroke:var(--acc);fill:none;stroke-width:2}
.pick:last-child{border-bottom:0}
.pick .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center}
.pick.on .box{background:var(--acc);border-color:var(--acc)}
.pick .box svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:3;opacity:0}
.pick.on .box svg{opacity:1}
.pick b{font-size:13px;font-weight:700;display:block;line-height:1.25}
.pick span{font-size:10px;color:var(--dim)}
.pick .txt{flex:1;min-width:0}
.pick .g{width:8px;height:8px;border-radius:50%;flex:none}
</style>
</head>
<body>
<svg id="defs" width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true"><defs></defs></svg>

<script>
/* ==========================================================
   GymTracker Pro — catálogo + motor de dibujos SVG
   ========================================================== */
const GROUPS = [
  { id:'pecho',      name:'Pecho',                short:'Pecho',      color:'#ff4d6d' },
  { id:'espalda',    name:'Espalda',              short:'Espalda',    color:'#38bdf8' },
  { id:'cuadriceps', name:'Pierna / Cuádriceps',  short:'Cuádriceps', color:'#facc15' },
  { id:'femoral',    name:'Femoral y Glúteo',     short:'Femoral',    color:'#fb923c' },
  { id:'hombro',     name:'Hombro',               short:'Hombro',     color:'#a78bfa' },
  { id:'biceps',     name:'Bíceps',               short:'Bíceps',     color:'#4ade80' },
  { id:'triceps',    name:'Tríceps',              short:'Tríceps',    color:'#22d3ee' },
  { id:'core',       name:'Core / Abdomen',       short:'Core',       color:'#f472b6' },
  { id:'cardio',     name:'Cardio',               short:'Cardio',     color:'#34d399' }
];
const GMAP = Object.fromEntries(GROUPS.map(g => [g.id, g]));

/* ---------- zonas dentro de cada grupo ---------- */
const ZONES = {
  pecho:      ['Superior','Medio','Inferior'],
  espalda:    ['Dorsal','Espalda media'],
  cuadriceps: ['Cuádriceps','Cuádriceps y glúteo','Gemelos'],
  femoral:    ['Femoral','Glúteo','Femoral y glúteo','Glúteo / cadera'],
  hombro:     ['Anterior','Lateral','Posterior'],
  biceps:     ['Bíceps','Braquial y antebrazo'],
  triceps:    ['Cabeza larga','Cabeza lateral','Tríceps completo'],
  core:       ['Abdomen superior','Abdomen inferior','Core global'],
  cardio:     ['Cinta de correr']
};
function zonesFor(g) { return ZONES[g] || []; }
function zoneFull(e) {
  if (!e || !e.z) return '';
  if (e.g === 'pecho') return 'Pecho ' + e.z.toLowerCase();
  if (e.g === 'hombro') return 'Deltoides ' + e.z.toLowerCase();
  if (e.g === 'espalda' && e.z === 'Dorsal') return 'Dorsal ancho';
  return e.z;
}


const MUSCLES = {
  pecho:      { label:'Pectoral',            color:'#ff4d6d' },
  espalda:    { label:'Dorsal / espalda',    color:'#38bdf8' },
  cuadriceps: { label:'Cuádriceps',          color:'#facc15' },
  gemelos:    { label:'Gemelos',             color:'#facc15' },
  cardio:     { label:'Cardio',              color:'#34d399' },
  femoral:    { label:'Femoral',             color:'#fb923c' },
  gluteo:     { label:'Glúteo',              color:'#fb923c' },
  hombro:     { label:'Deltoides',           color:'#a78bfa' },
  biceps:     { label:'Bíceps',              color:'#4ade80' },
  triceps:    { label:'Tríceps',             color:'#22d3ee' },
  core:       { label:'Abdomen / core',      color:'#f472b6' }
};

/* ---------- geometría ---------- */
const RAD = Math.PI / 180;
const pt = (x, y, a, l) => [x + Math.sin(a * RAD) * l, y - Math.cos(a * RAD) * l];
const P = (hip, torso, armU, armF, thigh, shin, extra) =>
  Object.assign({ hip, torso, armU, armF, thigh, shin }, extra || {});
const lerp = (a, b, t) => a + (b - a) * t;

function joints(p) {
  const sh   = pt(p.hip[0], p.hip[1], p.torso, p.torsoLen || 44);
  const head = pt(sh[0], sh[1], p.torso, 11);
  const el   = pt(sh[0], sh[1], p.armU, 22);
  const hand = pt(el[0], el[1], p.armF, 21);
  const el2  = pt(sh[0], sh[1], p.arm2U != null ? p.arm2U : p.armU, 22);
  const hand2= pt(el2[0], el2[1], p.arm2F != null ? p.arm2F : p.armF, 21);
  const knee = pt(p.hip[0], p.hip[1], p.thigh, 27);
  const foot = pt(knee[0], knee[1], p.shin, 27);
  const knee2= pt(p.hip[0], p.hip[1], p.thigh2 != null ? p.thigh2 : p.thigh, 27);
  const foot2= pt(knee2[0], knee2[1], p.shin2 != null ? p.shin2 : p.shin, 27);
  return { hip:p.hip, sh, head, el, hand, el2, hand2, knee, foot, knee2, foot2, pose:p };
}

/* ---------- piezas SVG ---------- */
const STEEL = '#8a97ad', STEEL_D = '#5a6578', DARK = '#2b3444';
const line = (a, b, w, c, cap) =>
  `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap||'round'}"/>`;

function post(x, y1, y2, w) {
  return `<rect x="${x}" y="${y1}" width="${w||7}" height="${y2-y1}" rx="3" fill="${STEEL_D}"/>`;
}
function floorLine() {
  return `<line x1="8" y1="200" x2="292" y2="200" stroke="#2b3444" stroke-width="2"/>`;
}
function benchPad(J, len) {
  const cx = (J.hip[0] + J.head[0]) / 2;
  const cy = (J.hip[1] + J.head[1]) / 2 + 7;
  const ang = Math.atan2(J.head[1] - J.hip[1], J.head[0] - J.hip[0]) / RAD;
  const L = len || 104;
  return `<g transform="rotate(${ang.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})">
    <rect x="${(cx-L/2).toFixed(1)}" y="${(cy-5).toFixed(1)}" width="${L}" height="10" rx="4" fill="#3b465c"/>
    <rect x="${(cx-26).toFixed(1)}" y="${(cy+4).toFixed(1)}" width="7" height="30" rx="2" fill="${DARK}"/>
    <rect x="${(cx+16).toFixed(1)}" y="${(cy+4).toFixed(1)}" width="7" height="30" rx="2" fill="${DARK}"/>
  </g>`;
}
function benchFlat(J, len) { return benchPad(J, len); }

function rack() {
  return `<g opacity=".95">
    ${post(16, 34, 200, 6)}${post(278, 34, 200, 6)}
    <rect x="16" y="34" width="268" height="6" rx="3" fill="${STEEL_D}"/>
    <rect x="34" y="196" width="244" height="6" rx="3" fill="${DARK}"/>
  </g>`;
}
function machineFrame() {
  return `<g>
    ${post(252, 42, 200, 8)}
    <rect x="240" y="150" width="34" height="52" rx="4" fill="#202836" stroke="${STEEL_D}" stroke-width="1.5"/>
    <rect x="244" y="156" width="26" height="6" rx="2" fill="${STEEL}"/>
    <rect x="244" y="167" width="26" height="6" rx="2" fill="${STEEL}"/>
    <rect x="244" y="178" width="26" height="6" rx="2" fill="${STEEL}"/>
    <rect x="244" y="189" width="26" height="6" rx="2" fill="${STEEL}"/>
    <rect x="240" y="196" width="60" height="6" rx="3" fill="${DARK}"/>
  </g>`;
}
function stackAt(x, y) {
  return `<g><rect x="${x}" y="${y}" width="26" height="44" rx="3" fill="#202836" stroke="${STEEL_D}" stroke-width="1.5"/>
  <rect x="${x+3}" y="${y+4}" width="20" height="5" rx="2" fill="${STEEL}"/>
  <rect x="${x+3}" y="${y+12}" width="20" height="5" rx="2" fill="${STEEL}"/>
  <rect x="${x+3}" y="${y+20}" width="20" height="5" rx="2" fill="${STEEL}"/>
  <rect x="${x+3}" y="${y+28}" width="20" height="5" rx="2" fill="${STEEL}"/></g>`;
}
function cableRig(px, py, opt) {
  opt = opt || {};
  const gy = 200;
  return `<g>
    ${post(px - 3, py, gy, 6)}
    <circle cx="${px}" cy="${py}" r="7" fill="#141a24" stroke="${STEEL}" stroke-width="2.5"/>
    ${stackAt(px + 8, 152)}
    <rect x="${px - 14}" y="${gy - 3}" width="46" height="5" rx="2" fill="${DARK}"/>
  </g>`;
}
function cableTo(from, to, col) {
  return `<line x1="${from[0]}" y1="${from[1]}" x2="${to[0].toFixed(1)}" y2="${to[1].toFixed(1)}" stroke="${col||'#c8d3e6'}" stroke-width="1.6" stroke-dasharray="1 0" opacity=".9"/>`;
}
function barAt(hand, width, plate) {
  const w = width || 92;
  const x = hand[0], y = hand[1];
  const p = plate === false ? '' : `
    <rect x="${-w/2-3}" y="-10" width="7" height="20" rx="2" fill="#4b5568"/>
    <rect x="${-w/2-9}" y="-13" width="6" height="26" rx="2" fill="#6d7a90"/>
    <rect x="${w/2-4}" y="-10" width="7" height="20" rx="2" fill="#4b5568"/>
    <rect x="${w/2+3}" y="-13" width="6" height="26" rx="2" fill="#6d7a90"/>`;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
    <rect x="${-w/2}" y="-2.4" width="${w}" height="4.8" rx="2.4" fill="#c9d4e6"/>
    ${p}</g>`;
}
function dbAt(hand, ang) {
  const a = ang || 0;
  return `<g transform="translate(${hand[0].toFixed(1)} ${hand[1].toFixed(1)}) rotate(${a})">
    <rect x="-2.5" y="-10" width="5" height="20" rx="2" fill="#9aa7bd"/>

function handleAt(hand) {
  return `<circle cx="${hand[0].toFixed(1)}" cy="${hand[1].toFixed(1)}" r="3.4" fill="#e8eefc"/>`;
}
function arrow(from, to, color) {
  const ang = Math.atan2(to[1]-from[1], to[0]-from[0]) / RAD;
  return `<g opacity=".85" transform="translate(${to[0].toFixed(1)} ${to[1].toFixed(1)}) rotate(${ang.toFixed(0)})">
    <path d="M-13 0 L-2 -5 L-2 5 Z" fill="${color}"/></g>`;
}

/* ---------- cuerpo ---------- */
function bodySVG(J, ex, phaseT) {
  const skin = '#e7eefc', skinBack = '#9fb0c9', joint = '#0b0f16';
  const p = J.pose;
  let s = '';
  // brazo trasero
  s += line(J.sh, J.el2, 6.5, skinBack) + line(J.el2, J.hand2, 5.6, skinBack);
  // pierna trasera
  s += line(J.hip, J.knee2, 8.4, skinBack) + line(J.knee2, J.foot2, 7, skinBack) + line(J.foot2, pt(J.foot2[0], J.foot2[1], 90, 7), 4.5, skinBack);
  // torso
  s += line(J.hip, J.sh, 17, skin);
  s += `<circle cx="${J.hip[0]}" cy="${J.hip[1]}" r="9" fill="${skin}"/>`;
  // cabeza
  const neck = pt(J.sh[0], J.sh[1], p.torso, 7);
  s += line(J.sh, neck, 6, skin);
  s += `<circle cx="${J.head[0].toFixed(1)}" cy="${J.head[1].toFixed(1)}" r="9.5" fill="${skin}" stroke="${joint}" stroke-width="1.2"/>`;
  // pierna delantera
  s += line(J.hip, J.knee, 9, skin) + line(J.knee, J.foot, 7.6, skin) + line(J.foot, pt(J.foot[0], J.foot[1], 90, 8), 5, skin);
  // brazo delantero
  s += line(J.sh, J.el, 7.4, skin) + line(J.el, J.hand, 6.4, skin);
  s += `<circle cx="${J.sh[0]}" cy="${J.sh[1]}" r="3" fill="${joint}"/><circle cx="${J.hip[0]}" cy="${J.hip[1]}" r="2.5" fill="${joint}"/>`;
  s += `<circle cx="${J.el[0].toFixed(1)}" cy="${J.el[1].toFixed(1)}" r="2.2" fill="${joint}" opacity=".55"/><circle cx="${J.knee[0].toFixed(1)}" cy="${J.knee[1].toFixed(1)}" r="2.2" fill="${joint}" opacity=".55"/>`;
  return s;
}

function muscleSVG(J, key, t) {
  const m = MUSCLES[key] || MUSCLES.pecho;
  const ang = J.pose.torso;
  let c, rx = 12, ry = 9, rot = ang;
  const mid = (a, b, f) => [lerp(a[0], b[0], f), lerp(a[1], b[1], f)];
  if (key === 'pecho') { c = mid(J.hip, J.sh, 0.66); rx = 13; ry = 10; }
  else if (key === 'espalda') { c = mid(J.hip, J.sh, 0.58); rx = 12; ry = 10; }
  else if (key === 'core') { c = mid(J.hip, J.sh, 0.34); rx = 12; ry = 12; }
  else if (key === 'hombro') { c = J.sh; rx = 10; ry = 10; rot = 0; }
  else if (key === 'biceps' || key === 'triceps') {
    c = mid(J.sh, J.el, 0.55); rx = 8; ry = 15;
    rot = Math.atan2(J.el[1]-J.sh[1], J.el[0]-J.sh[0]) / RAD + 90;
  } else if (key === 'cuadriceps' || key === 'femoral') {
    c = mid(J.hip, J.knee, 0.48); rx = 9; ry = 16;
    rot = Math.atan2(J.knee[1]-J.hip[1], J.knee[0]-J.hip[0]) / RAD + 90;
  } else if (key === 'gemelos') {
    c = mid(J.hip, J.knee, 0.86); rx = 8; ry = 11;
    rot = Math.atan2(J.knee[1]-J.hip[1], J.knee[0]-J.hip[0]) / RAD + 90;
  } else if (key === 'cardio') { c = J.hip; rx = 14; ry = 12; rot = 0; }
  else if (key === 'gluteo') { c = J.hip; rx = 12; ry = 11; rot = 0; }
  const pulse = 1 + Math.sin(t * Math.PI) * 0.06;
  return `<g>
    <ellipse cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${(rx*pulse).toFixed(1)}" ry="${(ry*pulse).toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)})" fill="url(#mg-${key})" opacity=".95"/>
    <ellipse cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${(rx*pulse).toFixed(1)}" ry="${(ry*pulse).toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)})" fill="none" stroke="${m.color}" stroke-width="1.2" opacity=".55"/>
  </g>`;
}

function glowDefs() {
  return Object.keys(MUSCLES).map(k => {
    const m = MUSCLES[k];
    return `<radialGradient id="mg-${k}"><stop offset="0" stop-color="${m.color}" stop-opacity=".72"/><stop offset=".55" stop-color="${m.color}" stop-opacity=".42"/><stop offset="1" stop-color="${m.color}" stop-opacity="0"/></radialGradient>`;
  }).join('');
}

/* ---------- interpolación y render ---------- */
const POSE_KEYS = ['torso','armU','armF','arm2U','arm2F','thigh','shin','thigh2','shin2','torsoLen'];
function lerpPose(a, b, t) {
  const out = { hip: [lerp(a.hip[0], b.hip[0], t), lerp(a.hip[1], b.hip[1], t)] };
  POSE_KEYS.forEach(k => {
    const av = a[k] != null ? a[k] : (k === 'arm2U' ? a.armU : k === 'arm2F' ? a.armF : k === 'thigh2' ? a.thigh : k === 'shin2' ? a.shin : null);
    const bv = b[k] != null ? b[k] : (k === 'arm2U' ? b.armU : k === 'arm2F' ? b.armF : k === 'thigh2' ? b.thigh : k === 'shin2' ? b.shin : null);
    if (av != null && bv != null) out[k] = lerp(av, bv, t);
  });
  return out;
}

function svgFor(ex, t, opts) {
  opts = opts || {};
  const p = PAT[ex.pat];
  if (!p) return '';
  const pose = lerpPose(p.a(ex), p.b(ex), t);
  const J = joints(pose);
  const muscle = ex.m || ex.g;
  let back = '', front = '';

  back += floorLine();
  if (p.pulley) back += cableRig(p.pulley[0], p.pulley[1], ex);
  if (p.rig) back += p.rig(J, ex);

  if (ex.eq === 'Polea' && p.pulley) {
    back += cableTo(p.pulley, J.hand);
    if (ex.rope) back += cableTo(p.pulley, J.hand2);
  }

  const body = bodySVG(J, ex, t);
  const glow = opts.noGlow ? '' : muscleSVG(J, muscle, t);

  // implemento
  const place = ex.place || 'hand';
  const anchor = place === 'sh' ? J.sh : place === 'hip' ? J.hip : J.hand;
  if (place === 'none') { /* máquina sin implemento en mano */ }
  else if (ex.eq === 'Barra') front += barAt(anchor, ex.barW || 88);
  else if (ex.eq === 'Mancuerna') front += dbAt(J.hand) + (ex.twoDb ? dbAt(J.hand2) : '');
  else if (ex.eq === 'Polea') front += handleAt(J.hand) + (ex.rope ? handleAt(J.hand2) : '');
  else if (ex.eq === 'Máquina' || ex.eq === 'Multipower') front += handleAt(J.hand);

  // flecha de recorrido
  let arrowSvg = '';
  if (opts.arrow) {
    const a = p.a(ex), b2 = p.b(ex), Ja = joints(a), Jb = joints(b2);
    const from = [Ja.hand[0], Ja.hand[1]], to = [Jb.hand[0], Jb.hand[1]];
    if (Math.abs(to[0]-from[0]) + Math.abs(to[1]-from[1]) > 8) {
      arrowSvg = `<g opacity=".9">${line(from, [lerp(from[0],to[0],0.72), lerp(from[1],to[1],0.72)], 2, '#d6ff3f')}${arrow(from, to, '#d6ff3f')}</g>`;
    }
  }

  return `<svg class="ex-svg" viewBox="0 0 300 218" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    ${back}${body}${glow}${front}${arrowSvg}
  </svg>`;
}

const ico = (n, cls) => `<svg viewBox="0 0 24 24" class="${cls||''}" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ---------- fechas de sesión ---------- */
function sessionVolume(s) {
  let v = 0, sets = 0;
  (s.entries || []).forEach(e => (e.sets || []).forEach(x => { if (x.done) { v += num(x.w) * num(x.r); sets++; } }));
  return { v, sets };
}
function lastMark(exId) {
  const list = S.sessions.slice().sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
  for (const s of list) {
    const e = (s.entries || []).find(x => x.exId === exId);
    if (e) {
      const done = (e.sets || []).filter(x => x.done && (num(x.w) > 0 || num(x.r) > 0 || num(x.time) > 0));
      if (done.length) {
        const l = done[done.length - 1];
        return { w: num(l.w), r: num(l.r), time: num(l.time), cardio: num(l.time) > 0, date: s.date, name: s.name };
      }
    }
  }
  return null;
}
function lastSessionSets(exId) {
  const list = S.sessions.slice().sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
  for (const s of list) {
    const e = (s.entries || []).find(x => x.exId === exId);
    if (e) {
      const done = (e.sets || []).filter(x => x.done && (num(x.w) > 0 || num(x.r) > 0 || num(x.time) > 0));
      if (done.length) return { sets: done.map(x => num(x.time) > 0 ? { inc: num(x.inc), spd: num(x.spd), time: num(x.time) } : { w: num(x.w), r: num(x.r) }), date: s.date };
    }
  }
  return null;
}
function prOf(exId) {
  const ex = exById(exId), cardio = ex && ex.mode === 'cardio';
  let max = 0, reps = 0, date = null, best1rm = 0, bestInc = 0, totalTime = 0;
  S.sessions.forEach(s => (s.entries || []).forEach(e => {
    if (e.exId !== exId) return;
    (e.sets || []).forEach(x => {
      if (!x.done) return;
      const w = cardio ? num(x.spd) : num(x.w), r = cardio ? num(x.inc) : num(x.r);
      if (w > max) { max = w; reps = r; date = s.date; }
      if (cardio) { bestInc = Math.max(bestInc, r); totalTime += num(x.time); }
      else {
        const orm = w * (1 + r / 30);
        if (orm > best1rm) best1rm = orm;
      }
    });
  }));
  return cardio ? { max, reps: bestInc, date, orm: 0, totalTime } : { max, reps, date, orm: Math.round(best1rm) };
}
function historyFor(exId) {
  const ex = exById(exId), cardio = ex && ex.mode === 'cardio';
  const rows = [];
  S.sessions.forEach(s => (s.entries || []).forEach(e => {
    if (e.exId !== exId) return;
    (e.sets || []).forEach(x => {
      if (!x.done) return;
      rows.push(cardio
        ? { date: s.date, w: num(x.inc), r: num(x.spd), vol: num(x.time), time: num(x.time), cardio: true, name: s.name }
        : { date: s.date, w: num(x.w), r: num(x.r), vol: num(x.w) * num(x.r), name: s.name });
    });
  }));
  return rows.sort((a, b) => a.date < b.date ? 1 : -1);
}


/* ---------- progreso por ejercicio ---------- */
let chartM = 'max';
const CHART_M = [['max','Peso máx.'],['orm','1RM est.'],['vol','Volumen']];
function progressRows(exId) {
  const by = {};
  S.sessions.forEach(s => (s.entries || []).forEach(e => {
    if (e.exId !== exId) return;
    (e.sets || []).forEach(x => {
      if (!x.done) return;
      const ex = exById(exId), cardio = ex && ex.mode === 'cardio';
      const w = cardio ? num(x.spd) : num(x.w), r = cardio ? num(x.inc) : num(x.r), t = cardio ? num(x.time) : 0;
      if (cardio ? !(t > 0) : !(w > 0 || r > 0)) return;
      const d = by[s.date] || (by[s.date] = { date:s.date, max:0, orm:0, vol:0 });
      if (cardio) { d.max = Math.max(d.max, w); d.vol += t; }
      else { d.max = Math.max(d.max, w); d.orm = Math.max(d.orm, w * (1 + r / 30)); d.vol += w * r; }
    });
  }));
  return Object.keys(by).sort().map(k => by[k]);
}
const fmtNum = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
const fmtAxis = v => String(Math.abs(v) >= 10 ? Math.round(v) : Math.round(v * 10) / 10).replace('.', ',');
function chartSVG(exId, metric) {
  const all = progressRows(exId);
  const pts = all.slice(-12);
  if (pts.length < 2) return `<div class="chart-empty">${ico('chart')}<span>${all.length ? 'Una sesión registrada. La gráfica aparece con la segunda.' : 'Aún no hay marcas de este ejercicio.'}</span></div>`;
  const W = 320, H = 134, PL = 42, PR = 14, PT = 16, PB = 26;
  const vals = pts.map(d => d[metric]);
  let mn = metric === 'vol' ? 0 : Math.min.apply(null, vals);
  let mx = Math.max.apply(null, vals);
  if (metric !== 'vol' && mx - mn < 2) { const c = (mx + mn) / 2; mn = c - 1.5; mx = c + 1.5; }
  if (mx === mn) mx = mn + 1;
  const pad = (mx - mn) * 0.12; mn = Math.max(0, mn - pad); mx = mx + pad;
  const X = i => PL + i * (W - PL - PR) / (pts.length - 1);
  const Y = v => PT + (mx - v) * (H - PT - PB) / (mx - mn);
  const xy = pts.map((d, i) => [X(i), Y(d[metric])]);
  const line = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${xy[xy.length-1][0].toFixed(1)} ${H-PB} L${xy[0][0].toFixed(1)} ${H-PB} Z`;
  const grid = [0, .5, 1].map(f => {
    const y = PT + f * (H - PT - PB), v = mx - f * (mx - mn);
    return `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#26303f" stroke-width="1"/>
      <text x="${PL-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" fill="#7d8ba1" font-size="9" font-weight="700">${fmtAxis(v)}</text>`;
  }).join('');
  const dots = xy.map((p, i) => {
    const last = i === xy.length - 1;
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?4.2:2.6}" fill="${last?'#d6ff3f':'#0c1118'}" stroke="#d6ff3f" stroke-width="${last?0:2}"/>`;
  }).join('');
  const d0 = dateParts(pts[0].date), d1 = dateParts(pts[pts.length-1].date);
  const lastVal = pts[pts.length-1][metric];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ${CHART_M.find(m=>m[0]===metric)[1]}">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6ff3f" stop-opacity=".26"/><stop offset="1" stop-color="#d6ff3f" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#cg)"/>
    <path d="${line}" fill="none" stroke="#d6ff3f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${W-PR}" y="${PT-4}" text-anchor="end" fill="#f2f6ff" font-size="11" font-weight="800">${fmtNum(lastVal)}${metric==='vol'?' kg':''}</text>
    <text x="${PL}" y="${H-8}" fill="#7d8ba1" font-size="9" font-weight="700">${d0.d} ${d0.m}</text>
    <text x="${W-PR}" y="${H-8}" text-anchor="end" fill="#7d8ba1" font-size="9" font-weight="700">${d1.d} ${d1.m}</text>
  </svg>`;
}
function chartDelta(exId, metric) {
  const rows = progressRows(exId);
  if (rows.length < 2) return '';
  const a = rows[0][metric], b = rows[rows.length - 1][metric], d = b - a;
  const best = Math.max.apply(null, rows.map(r => r[metric]));
  const sign = d > 0 ? '+' : '';
  const label = metric === 'vol' ? ' kg de volumen' : ' kg';
  return `<div class="chart-foot">
    <span class="${d > 0 ? 'up' : (d < 0 ? 'down' : '')}">${sign}${fmtNum(d)}${label}</span> desde la primera sesión
    <span class="best">Mejor: ${fmtNum(best)} kg</span>
  </div>`;
}

function newEntry(exId) {
  const ex = exById(exId), lm = lastMark(exId);
  const cardio = ex && ex.mode === 'cardio';
  const first = cardio
    ? { inc: lm && lm.cardio ? String(lm.w) : '', spd: lm && lm.cardio ? String(lm.r) : '', time: lm && lm.cardio ? String(lm.time || '') : '', done:false }
    : { w: lm && !lm.cardio ? String(lm.w) : '', r: lm && !lm.cardio ? String(lm.r) : '', done:false };
  return { exId, sets:[first], notes:'' };
}
function startSession(routineId, exIds) {
  const r = routineId ? S.routines.find(x => x.id === routineId) : null;
  const ids = exIds || (r ? r.ids : []);

function elapsedText(from) {

}

function checkPR(exId, w, r) {
  const prev = prOf(exId);
  if (!(prev.max > 0) && !(prev.orm > 0)) return null;
  const orm = Math.round(w * (1 + r / 30));
  if (w > 0 && w > prev.max) return { kind:'peso', w, r, now:w, prev:prev.max };
  if (r > 0 && w > 0 && orm > prev.orm) return { kind:'1rm', w, r, now:orm, prev:prev.orm };
  return null;
}
let prT = null;
function showPR(ex, pr) {
  const el = $('#prBanner');
  if (!el) return;
  const title = pr.kind === 'peso' ? 'Nuevo récord de peso' : 'Nuevo récord de 1RM';
  el.innerHTML = `<div class="pr-ico">${ico('flame')}</div>
    <div class="pr-txt"><b>${title}</b><span>${esc(ex ? ex.n : '')} · ${pr.w} kg × ${pr.r}</span></div>
    <div class="pr-val">${pr.kind === 'peso' ? pr.w + ' kg' : '~' + pr.now + ' kg'}</div>`;
  el.classList.add('on');
  clearTimeout(prT);
  prT = setTimeout(() => el.classList.remove('on'), 4500);
  try { beep(); } catch (e) {}
  if (navigator.vibrate) { try { navigator.vibrate([40, 60, 40]); } catch (e) {} }
}
function toggleSet(ei, si) {
  unlockAudio();
  const set = S.active.entries[ei].sets[si];
  const ex = exById(S.active.entries[ei].exId);
  if (!set.done) {
    if (ex && ex.mode === 'cardio') {
      if (!num(set.time)) { toast('Añade el tiempo del tramo'); return; }
      if (!num(set.inc) && !num(set.spd)) { toast('Añade inclinación o velocidad'); return; }
    } else {
      if (!num(set.w) && !num(set.r)) { toast('Pon peso y repeticiones antes de marcar'); return; }
      if (!num(set.r)) { toast('Añade las repeticiones'); return; }
    }
    const ent = S.active.entries[ei];
    const pr = ex && ex.mode === 'cardio' ? null : checkPR(ent.exId, num(set.w), num(set.r));
    set.done = true;
    save();
    renderTrainView();
    startRest(S.settings.rest);
    if (pr && ex && !set.prShown) { showPR(ex, pr); set.prShown = true; }
  } else {
    set.done = false; save(); renderTrainView();
  }
}

function addSet(ei) {
  const e = S.active.entries[ei];

function measureDelta(list, field) {
  if (!list || list.length < 2) return null;
  const now = num(list[0][field]), before = num(list[1][field]);
  if (!(now > 0 && before > 0)) return null;
  return { d: now - before, pct: before ? (now - before) / before * 100 : 0 };
}
function measureChart(list, field, unit) {
  const pts = list.slice().reverse().filter(x => num(x[field]) > 0).map(x => ({ date: x.date, v: num(x[field]) }));
  if (pts.length < 2) return `<div class="empty" style="padding:18px 0">${ico('chart')}<span>Registra al menos dos mediciones para ver la evolución.</span></div>`;
  const W = 320, H = 120, PL = 34, PR = 10, PT = 12, PB = 22;
  const vals = pts.map(p => p.v);
  let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mx - mn < 1) { const c = (mx + mn) / 2; mn = c - 1; mx = c + 1; }
  const x = i => PL + i * (W - PL - PR) / (pts.length - 1);
  const y = v => PT + (1 - (v - mn) / (mx - mn)) * (H - PT - PB);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
    <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="var(--line2)" stroke-width="1"/>
    <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="var(--line2)" stroke-width="1"/>
    <path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="var(--acc)"/>`).join('')}
    <text x="${PL}" y="${H-6}" fill="var(--dim)" font-size="9">${dateParts(pts[0].date).d}/${dateParts(pts[0].date).m}</text>
    <text x="${W-PR}" y="${H-6}" text-anchor="end" fill="var(--dim)" font-size="9">${dateParts(pts[pts.length-1].date).d}/${dateParts(pts[pts.length-1].date).m}</text>
  </svg>`;
}

let anim = { ex:null, playing:false, raf:null };
function stopAnim() { if (anim.raf) cancelAnimationFrame(anim.raf); anim.raf = null; anim.playing = false; }
function playAnim() {
  if (!anim.ex) return;
  stopAnim();
  anim.playing = true;
  const ex = anim.ex, box = $('#animSvg');
  if (!box) return;
  const t0 = performance.now();
  const loop = now => {
    const ph = (1 - Math.cos((now - t0) / 2500 * Math.PI * 2)) / 2;
    box.innerHTML = svgFor(ex, ph, { arrow:false });
    anim.raf = requestAnimationFrame(loop);
  };
  anim.raf = requestAnimationFrame(loop);
  const b = $('#playBtn'); if (b) b.innerHTML = ico('pause');
}
function showPhase(t) {
  stopAnim();
  const box = $('#animSvg');
  if (box && anim.ex) box.innerHTML = svgFor(anim.ex, t, { arrow:false });
  const b = $('#playBtn'); if (b) b.innerHTML = ico('play');
  $$('.phase button').forEach(x => x.classList.toggle('on', Number(x.dataset.v) === t));
}

/* ==========================================================

   ========================================================== */
function estimateSessionCalories(sess) {
  const p = (S.settings && S.settings.profile) || {};
  const weight = num(p.weight) || 75;
  const durMin = Math.max(1, (sess.finishedAt - sess.startedAt) / 60000);
  let cardioMin = 0, cardioKcal = 0;
  (sess.entries || []).forEach(e => {
    const ex = exById(e.exId);
    if (!ex || ex.mode !== 'cardio') return;
    (e.sets || []).forEach(s => {
      const t = num(s.time);
      if (!(t > 0)) return;
      const kmh = num(s.spd), grade = num(s.inc) / 100;
      const speed = kmh * 16.6667;
      const vo2 = 0.1 * speed + 1.8 * speed * grade + 3.5;
      cardioKcal += vo2 * weight / 1000 * 5 * t;
      cardioMin += t;
    });
  });
  const strengthMin = Math.max(0, durMin - cardioMin);
  const strengthKcal = strengthMin * 3.5 * 3.5 * weight / 200;
  return { total: Math.round(cardioKcal + strengthKcal), cardio: Math.round(cardioKcal), strength: Math.round(strengthKcal), durMin: Math.round(durMin), weight };
}

function finishSession() {
  const a = S.active;
  if (!a) return;
  const entries = a.entries.filter(e => e.sets.some(s => s.done));
  if (!entries.length) { toast('Marca al menos una serie completada'); return; }
  const prs = [];
  entries.forEach(e => {
    const ex = exById(e.exId);
    if (ex && ex.mode === 'cardio') return;
    const prev = prOf(e.exId);
    const best = Math.max.apply(null, e.sets.filter(s => s.done).map(s => num(s.w)).concat([0]));
    if (best > prev.max && best > 0) prs.push({ id:e.exId, w:best, prev:prev.max });
  });
  const sess = {
    id: a.id, name: a.name, routineId: a.routineId, date: a.date,
    startedAt: a.startedAt, finishedAt: Date.now(),
    entries: entries.map(e => ({
      exId: e.exId,
      sets: e.sets.filter(s => s.done).map(s => {
        const ex = exById(e.exId);
        return ex && ex.mode === 'cardio'
          ? { inc: num(s.inc), spd: num(s.spd), time: num(s.time), done:true }
          : { w: num(s.w), r: num(s.r), done:true };
      }),
      notes: e.notes || ''
    }))
  };
  S.sessions.push(sess);
  S.active = null;
  save();
  render();
  const v = sessionVolume(sess);
  const dur = Math.max(1, Math.round(((sess.finishedAt - sess.startedAt) / 60000)));
  const kcal = estimateSessionCalories(sess);
  openSheet('Sesión guardada', dateParts(sess.date).full, `
    <div class="hero" style="padding:18px">
      <div class="kicker">${esc(sess.name)}</div>
      <h2 style="margin-top:6px">${fmtVol(v.v)} de volumen</h2>
      <div class="score">
        <div class="stat"><b>${v.sets}</b><span>Series</span></div>
        <div class="stat"><b>${sess.entries.length}</b><span>Ejercicios</span></div>
        <div class="stat"><b>${dur} min</b><span>Duración</span></div>
      <div class="stat"><b>${kcal.total}</b><span>kcal aprox.</span></div>
      </div>
      <p class="sub" style="margin-top:10px">Estimación: ${kcal.strength} kcal de fuerza y descansos, ${kcal.cardio} kcal de cinta. Usa tu peso en Ajustes para mejorar la estimación.</p>
    </div>
    ${prs.length ? `<h2 class="sect">Nuevos récords</h2><div class="card">${prs.map(p => {
      const ex = exById(p.id);
      return `<div class="set-rowline"><div><b>${esc(ex ? ex.n : p.id)}</b><span>Antes ${p.prev} kg</span></div><div class="chip" style="color:var(--acc);border-color:var(--acc)">${p.w} kg</div></div>`;
    }).join('')}</div>` : `<div class="d-tip" style="margin-top:12px">Sesión registrada. La próxima vez verás estas marcas bajo cada ejercicio.</div>`}
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-primary" data-act="closeSheet">Hecho</button>
      <button class="btn btn-ghost" data-act="goHist">Ver historial</button>
    </div>
  `);
}

/* ==========================================================
   TEMPORIZADOR DE DESCANSO
   ========================================================== */
const rest = { endAt:0, total:0, int:null, done:false };
let actx = null;
function audioReady() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function unlockAudio() {
  const ctx = audioReady();
  if (!ctx) return;
  try {
    if (ctx.state === 'suspended') ctx.resume();
    const buf = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
  } catch (e) {}
}
function beep() {
  const ctx = audioReady();
  if (!ctx) return;
  try { if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
  [0, 0.19, 0.38].forEach((d, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = [880, 1175, 1568][i];
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + d;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    o.start(t); o.stop(t + 0.2);
  });
}
/* ---------- pantalla encendida ---------- */
function syncWakeBtns() {
  const on = !!S.settings.keepAwake;
  const b = $('#wakeBtn');
  if (b) {
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.title = on ? 'Pantalla encendida durante el descanso' : 'Pantalla normal durante el descanso';
  }
}
let wake = null;
async function wakeOn() {
  if (!S.settings.keepAwake) return;
  try {
    if (!navigator.wakeLock || !navigator.wakeLock.request) return;
    if (wake && !wake.released) return;
    wake = await navigator.wakeLock.request('screen');
    wake.addEventListener('release', () => { wake = null; });
  } catch (e) { wake = null; }
}
function wakeOff() {
  try { if (wake) { const w = wake; wake = null; w.release(); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && rest.endAt && Date.now() < rest.endAt) wakeOn();
});
function startRest(sec) {
  unlockAudio();
  const s = Math.max(5, Math.round(sec));
  rest.total = s * 1000;
  rest.endAt = Date.now() + rest.total;
  rest.done = false;
  $('#restbar').classList.add('on');
  $('#timerPill').classList.remove('hide');
  document.body.classList.add('resting');
  $$('.rest-quick button[data-v]').forEach(b => b.classList.toggle('on', Number(b.dataset.v) === s));
  if (rest.int) clearInterval(rest.int);
  rest.int = setInterval(tickRest, 250);
  tickRest();
  wakeOn();
}
function tickRest() {
  const left = Math.max(0, rest.endAt - Date.now());
  const s = Math.ceil(left / 1000);
  const txt = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const t = $('#restTime'); if (t) t.textContent = txt;
  const p = $('#pillTime'); if (p) p.textContent = txt;
  const f = $('#restBarFill'); if (f) f.style.width = (rest.total ? (left / rest.total * 100) : 0) + '%';
  if (left <= 0 && !rest.done) {
    rest.done = true;
    clearInterval(rest.int); rest.int = null;
    beep();
    if (navigator.vibrate) { try { navigator.vibrate([200, 80, 200]); } catch (e) {} }
    wakeOff();
    const l = $('#restNext'); if (l) l.textContent = '¡Descanso terminado!';
    toast('Descanso terminado · a por la siguiente serie');
  }
}
function stopRest() {
  wakeOff();
  if (rest.int) clearInterval(rest.int);
  rest.int = null;
  $('#restbar').classList.remove('on');
  $('#timerPill').classList.add('hide');
  document.body.classList.remove('resting');
  rest.endAt = 0; rest.done = false;
}

async function downloadSelf() {
  try {
    const res = await fetch(location.href, { cache:'no-store' });
    if (!res.ok) throw new Error('bad');
    const txt = await res.text();
    const blob = new Blob([txt], { type:'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'GymTrackerPro.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Archivo descargado · míralo en Descargas o Archivos');
  } catch (e) {
    toast('Abre la app en una pestaña del navegador para poder descargarla');
  }
}
function exportData() {
  const data = {
    app: 'GymTracker Pro', version: 1, exportedAt: new Date().toISOString(),
    routines: S.routines, custom: S.custom, sessions: S.sessions, settings: S.settings
  };
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gymtracker-pro-' + isoToday() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
    toast('Copia de seguridad exportada');
  } catch (e) { toast('No se pudo exportar en este navegador'); }
}
function handleImportFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(String(reader.result)); } catch (e) { toast('Archivo no válido'); return; }
    if (!data || !Array.isArray(data.sessions)) { toast('Este archivo no es una copia de GymTracker Pro'); return; }
    openSheet('Restaurar copia', esc(file.name), `
      <div class="d-last">
        <div class="cell"><span>Sesiones</span><b>${data.sessions.length}</b></div>
        <div class="cell"><span>Rutinas</span><b>${(data.routines||[]).length}</b></div>
        <div class="cell"><span>Propios</span><b>${(data.custom||[]).length}</b></div>
      </div>
      <p class="sub" style="margin-top:12px">Fusionar mantiene lo que ya tienes y añade lo que falte. Reemplazar borra tus datos actuales y deja exactamente la copia.</p>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn btn-primary" data-act="applyImport" data-mode="merge">Fusionar</button>
        <button class="btn btn-danger" data-act="applyImport" data-mode="replace">Reemplazar</button>
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:9px" data-act="closeSheet">Cancelar</button>
    `);
    window.__importData = data;
  };
  reader.readAsText(file);
}
function applyImport(mode) {
  const data = window.__importData;
  if (!data) return;
  if (mode === 'replace') {
    S.routines = data.routines || [];
    S.custom = data.custom || [];
    S.sessions = data.sessions || [];
    S.settings = Object.assign({ rest:90, keepAwake:true }, data.settings || {});
    S.active = null;
  } else {
    const seen = new Set(S.sessions.map(s => s.id));
    (data.sessions || []).forEach(s => { if (!seen.has(s.id)) S.sessions.push(s); });
    const rIds = new Set(S.routines.map(r => r.id));
    (data.routines || []).forEach(r => { if (!rIds.has(r.id)) S.routines.push(r); });
    const cIds = new Set(S.custom.map(c => c.id));
    (data.custom || []).forEach(c => { if (!cIds.has(c.id)) S.custom.push(c); });
  }
  save(); closeSheet(); render();
  toast('Copia restaurada · ' + S.sessions.length + ' sesiones');
}

}
function render() {
  const v = $('#view');
  v.innerHTML =
    route === 'inicio' ? renderHome() :
    route === 'entrenar' ? renderTrain() :
    route === 'catalogo' ? renderCatalog() :
    route === 'historial' ? renderHistory() :
    route === 'medidas' ? renderMeasurements() : renderSettings();
  updateTabs();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'catSearch') { catF.q = el.value; const l = $('#catList'); if (l) l.innerHTML = catalogListHTML(); return; }
  if (el.id === 'pickExSearch') { const l = $('#pickExList'); if (l) l.innerHTML = pickerListHTML(el.value); return; }
  if (el.id === 'pickSearch') { pickQ = el.value; refreshPickList(); return; }
  if (el.id === 'rName' && draftR) { draftR.name = el.value; return; }
  if (el.dataset.field && el.dataset.ex != null && S.active) {
    const ei = Number(el.dataset.ex), si = Number(el.dataset.si);
    const set = S.active.entries[ei] && S.active.entries[ei].sets[si];
    if (set) { set[el.dataset.field] = el.value; set.prShown = false; save(); syncSessionStats(); }
    return;
  }
  if (el.dataset.note && S.active) {
    const ei = Number(el.dataset.note);
    if (S.active.entries[ei]) { S.active.entries[ei].notes = el.value; save(); }
  }
  if (el.dataset.profile) {
    S.settings.profile = S.settings.profile || { sex:'hombre', weight:'', height:'', age:'' };
    S.settings.profile[el.dataset.profile] = el.value;
    save();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'histSel') { histEx = e.target.value; render(); }
  if (e.target.id === 'ceGroup') {
    const z = $('#ceZone');
    if (z) z.innerHTML = zonesFor(e.target.value).map(v => `<option>${esc(v)}</option>`).join('');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && e.target.id === 'rName') { e.preventDefault(); saveRoutine(); }
});
$('#fileImp').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) handleImportFile(f); });

/* arranque */
$('#defs').innerHTML = glowDefs();
$('#wakeBtn').innerHTML = ico('sun');
syncWakeBtns();
document.addEventListener('pointerdown', unlockAudio, { once:true });
document.addEventListener('keydown', unlockAudio, { once:true });
document.addEventListener('touchend', unlockAudio, { once:true });
$('#tabs').innerHTML = TABS.map(t => `<button class="tab" data-act="go" data-r="${t.id}">${ico(t.icon)}<span>${t.label}</span>${t.id === 'entrenar' ? '<i class="badge hide" id="tabBadge"></i>' : ''}</button>`).join('');
render();
setInterval(() => {
  const c = $('#sessClock');
  if (c && S.active) c.textContent = elapsedText(S.active.startedAt);
}, 1000);
</script>
</body>
</html>
